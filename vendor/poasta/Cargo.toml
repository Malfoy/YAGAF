[package]
name = "poasta"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
autobins = false

[dependencies]
ahash = "0.8.3"
bincode = "1.3.3"
itertools = "0.14.0"
num = "0.4"
petgraph = { version = "~0.8", features = ["serde-1"] }
rustc-hash = "~2.1"
serde = { version = "~1.0", features = ["derive"] }
serde_json = "1.0.99"
smallvec = { version = "1.11.0", features = ["const_generics", "union", "serde"] }
